version: "1.0"
archetype: bff-fastify

agent_review:
  enabled: true
  agent: code-reviewer
  timeout_seconds: 300

rules:
  missing_tests:
    severity: error
    description: "Arquivo de rota ou serviço sem teste correspondente"
  security_violation:
    severity: error
    description: "Vulnerabilidade detectada em dependências (high/critical)"
  type_errors:
    severity: error
    description: "Erros de tipo detectados pelo TypeScript"
  missing_route_schema:
    severity: warn
    description: "Rota sem schema Zod correspondente"
  business_logic_in_bff:
    severity: warn
    description: "Lógica de negócio detectada no BFF"
